<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M Card AR</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

/* Splash Screen เต็มจอ */
#splash{
    width:100vw;
    height:100vh;
    background:url('Splashscreen-Mcard.jpg') center center no-repeat;
    background-size:cover;
    position:relative;
}

/* พื้นที่กดตรงปุ่ม "เริ่มเล่น AR" */
#startBtn{
    position:absolute;
    left:50%;
    bottom:17%;
    transform:translateX(-50%);
    width:320px;
    height:90px;
    cursor:pointer;
    background:transparent;
    border:none;
}
</style>
</head>

<body>

<div id="splash">
    <button id="startBtn"></button>
</div>

<script>
document.getElementById('startBtn').onclick = function () {

    // เปิดไฟล์ GLB โดยตรง
    window.location.href = "icon-Mcard-3D.glb";

};
</script>

</body>
</html>
