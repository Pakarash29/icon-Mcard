<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M Card AR</title>

<!-- model-viewer library สำหรับแสดงโมเดล 3D และเปิดโหมด AR -->
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; font-family: 'Kanit', 'Prompt', sans-serif; }

  /* ============================================================
     1) SPLASH SCREEN
  ============================================================ */
  #splash {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    text-align: center;
    color: #fff;
    /* พื้นหลังไล่สีสามเหลี่ยมตัดกันแบบในภาพตัวอย่าง */
    background:
      linear-gradient(135deg, transparent 49.5%, rgba(255,255,255,0.15) 50%, transparent 50.5%),
      radial-gradient(circle at 15% 20%, #4c2fd6 0%, transparent 45%),
      radial-gradient(circle at 85% 15%, #6a0f6b 0%, transparent 50%),
      linear-gradient(200deg, #d8bfe8 0%, #b23fae 35%, #c4123f 65%, #e8134b 100%);
    position: relative;
  }

  /* พื้นที่โลโก้ตรงกลาง */
  #splash-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 20px;
  }

  #splash-logo {
    font-size: 96px;
    font-weight: 800;
    line-height: 0.8;
    background: linear-gradient(180deg, #d9ffe6 0%, #ffffff 60%, #cfd9ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: 2px;
  }
  #splash-sub {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 10px;
    color: #dfe6ff;
    margin-top: -6px;
  }

  #startBtn {
    background: #fff;
    color: #1a1a1a;
    border: none;
    padding: 18px 44px;
    border-radius: 999px;
    font-size: 19px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  }
  #startBtn:active { transform: scale(0.97); }

  /* แถบโลโก้พาร์ทเนอร์ด้านล่าง */
  #splash-footer {
    width: 100%;
    padding: 18px 16px 28px;
    background: rgba(90, 5, 20, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
    flex-wrap: wrap;
  }
  #splash-footer img {
    height: 22px;
    object-fit: contain;
    filter: brightness(0) invert(1); /* ทำโลโก้เป็นสีขาวทั้งหมด ปรับ/ลบได้ตามไฟล์จริง */
    opacity: 0.9;
  }

  /* ============================================================
     2) AR / 3D VIEWER (ซ่อนไว้ก่อน จนกว่าจะกดปุ่ม)
  ============================================================ */
  #ar-container {
    display: none;
    width: 100vw;
    height: 100vh;
    position: relative;
  }
  model-viewer {
    width: 100%;
    height: 100%;
    --poster-color: #1a0a1f;
  }
  #ar-button {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: #E8134B;
    color: #fff;
    border: none;
    padding: 14px 32px;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 600;
  }
  #backBtn {
    position: absolute;
    top: 20px;
    left: 20px;
    background: rgba(0,0,0,0.4);
    color: #fff;
    border: none;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    font-size: 18px;
  }
</style>
</head>
<body>

  <!-- ============ Splash Screen ============ -->
  <div id="splash">
    <div style="height:1px"></div>

    <div id="splash-center">
      <div id="splash-logo">M</div>
      <div id="splash-sub">CARD</div>
      <button id="startBtn">เริ่มเล่น AR</button>
    </div>

    <div id="splash-footer">
      <!-- แทนที่ src ด้วยไฟล์โลโก้จริงที่อัปโหลดเข้า repo เช่น logos/themall.png -->
      <img src="logos/logo1.png" alt="partner logo">
      <img src="logos/logo2.png" alt="partner logo">
      <img src="logos/logo3.png" alt="partner logo">
      <img src="logos/logo4.png" alt="partner logo">
    </div>
  </div>

  <!-- ============ AR / 3D Container ============ -->
  <div id="ar-container">
    <button id="backBtn">←</button>
    <model-viewer
      id="myModel"
      src="icon-Mcard-3D.glb"
      alt="M Card 3D Model"
      ar
      ar-modes="webxr scene-viewer quick-look"
      camera-controls
      auto-rotate
      shadow-intensity="1"
    >
      <button id="ar-button" slot="ar-button">📷 ดูใน AR</button>
    </model-viewer>
  </div>

  <script>
    const splash = document.getElementById('splash');
    const arContainer = document.getElementById('ar-container');
    const startBtn = document.getElementById('startBtn');
    const backBtn = document.getElementById('backBtn');

    startBtn.addEventListener('click', () => {
      splash.style.display = 'none';
      arContainer.style.display = 'block';
    });

    backBtn.addEventListener('click', () => {
      arContainer.style.display = 'none';
      splash.style.display = 'flex';
    });
  </script>

</body>
</html>
