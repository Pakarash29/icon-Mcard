<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M Card AR</title>

https://unpkg.com/@google/model-viewer/dist/model-viewer.min.jsscript>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
}

/* Splash เต็มจอ */
#splash{
  position:fixed;
  inset:0;
  background:url('Splashscreen-Mcard.jpg') center center no-repeat;
  background-size:cover;
  z-index:9999;
}

/* พื้นที่กดทับปุ่มในภาพ */
#startAR{
  position:absolute;
  left:50%;
  bottom:18%;
  transform:translateX(-50%);
  width:320px;
  height:90px;
  background:transparent;
  border:none;
  cursor:pointer;
}

/* ซ่อน model-viewer */
model-viewer{
  width:1px;
  height:1px;
  opacity:0;
  position:absolute;
}
</style>
</head>

<body>

<div id="splash">
  <button id="startAR"></button>
</div>

<model-viewer
  id="model"
  src="icon-Mcard-3D.glb"
  ar
  ar-modes="scene-viewer quick-look webxr"
  camera-controls>
</model-viewer>

<script>
document.getElementById('startAR').addEventListener('click', async () => {

  const model = document.getElementById('model');

  try {
    await model.activateAR();
  } catch (e) {
    console.log(e);
  }

});
</script>

</body>
</html>
